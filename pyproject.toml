[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mictranscribe"
version = "0.1.0"
description = "Local, offline, VAD-driven microphone transcription to daily text logs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.0.0",
    "platformdirs>=4.0",
    "numpy>=1.24",
    "tomli-w>=1.0",
    "filelock>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
mictranscribe = "mictranscribe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[tool.setuptools.packages.find]
where = ["src"]
